name: Web P2P file transfer checks

on:
  workflow_dispatch:

concurrency:
  group: web-file-transfer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install frontend dependencies and build
        run: |
          corepack enable
          corepack prepare pnpm@11.0.7 --activate
          pnpm install --frozen-lockfile
          pnpm run build
      - name: Verify transfer records, sources, destinations and authorization
        run: |
          node --test web/e2e/file_drop.test.mjs web/e2e/file_selection.test.mjs
          go test -race ./internal/filetransfer ./internal/agent -run 'Test(Receive|Send|FileUpload|FileDownload)' -count=1
          go test -race ./internal/server -run '^TestFile(Upload|Download|Transfer)' -count=1 -timeout=3m
          go test ./internal/tunnel -count=1
          go test ./internal/store -run '^TestMainStorePooledConnectionsWaitForWriters$' -count=1
      - name: Verify real browser-to-Agent transfers and fallback
        run: |
          npm install --prefix "$RUNNER_TEMP/ui-e2e" --no-save playwright@1.56.1
          node "$RUNNER_TEMP/ui-e2e/node_modules/playwright/cli.js" install --with-deps chromium
          export GOSSHD_UI_E2E_NODE="$(command -v node)"
          export GOSSHD_UI_E2E_PLAYWRIGHT="$RUNNER_TEMP/ui-e2e/node_modules/playwright"
          export GOSSHD_UI_E2E_BROWSER="$(node -e 'console.log(require(process.argv[1]).chromium.executablePath())' "$GOSSHD_UI_E2E_PLAYWRIGHT")"
          go test ./internal/server -run '^TestFile(Upload|Download|Selection)UIE2EWithBrowser$' -count=1 -timeout=8m
