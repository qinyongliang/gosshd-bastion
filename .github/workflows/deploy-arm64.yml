name: Deploy ARM64 server

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy Linux ARM64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build frontend
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@11.0.7 --activate
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Build ARM64 server
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/server/linux-arm64
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 \
            go build -trimpath -ldflags="-s -w -X main.version=${GITHUB_SHA}" \
            -o build/server/linux-arm64/gosshd-server ./cmd/gosshd-server
          sha256sum build/server/linux-arm64/gosshd-server

      - name: Upload ARM64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: gosshd-server-linux-arm64-${{ github.sha }}
          path: build/server/linux-arm64/gosshd-server
